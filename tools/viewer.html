<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Model Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05030c; color: #fff4e0; font: 12px monospace; overflow: hidden; }
    #ui { position: fixed; left: 8px; top: 8px; background: #120a1ecc; padding: 6px 8px; border: 2px solid #ff2e88; }
    #ui label { display: block; margin: 2px 0; }
  </style>
</head>
<body>
  <!-- Dev-only model viewer (npm run dev, then /tools/viewer.html). Not part of the build.
       Query: ?m=shuttle|freighter|chimera|mite|hovercar|apc|landtrain|crane|garage  &gear=0..1 &ramp=0..1 &thrust=0..1 &lift=0..1
       &seed=N (chimera)  garage: &open=101 &trim=hex  crane: &h=34 &slew=rad &trolley=0..1 &rope=m &color=hex &faction=kepler|meridian|spacecom|vostok  landtrain: &type=moonliner|prospector &faction=spacecom|vostok|kepler|meridian &cars=a,b,c &unit=0..n &parts=body,legs,head[,extraHead] &mods=a,b &size=1.1 &yaw=deg &pitch=deg &dist=m &at=x,y,z &spin=0|1
       ?m=outpost &kind=mast &src=kit|glb|both &wreck=1 &color=rrggbb &cols=0  (Kit build beside the Blender build, with every
       collider, blast box and gameplay point drawn; see docs/outpost-glb.md) -->
  <div id="ui"></div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
